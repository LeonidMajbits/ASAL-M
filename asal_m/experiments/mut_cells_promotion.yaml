name: mutation_cells_promotion
seed: 34
substrate: mutation_cells
search_mode: promotion
budget: 18
steps: 96
frame_stride: 4
capture_state_every: 12
artifact_root: runs
reference:
  baseline_name: example_guest_baseline
  intent: example promotion-mode search with stronger validation cadence
objective_weights:
  mechanism_signal: 0.18
target_metrics:
  occupancy: 0.28
  diversity: 0.45
  lineage_entropy: 0.7
  budget_entropy: 0.55
prefilter:
  min_steps: 20
  min_activity: 0.01
  min_occupancy: 0.03
validation:
  interval: 2
  long_steps_multiplier: 2
  neighbor_samples: 6
  perturbations:
    - kind: radiation
      magnitude: 0.14
    - kind: charge_drop
      factor: 0.45
    - kind: wipe_patch
      size: 0.16
search_space:
  params:
    lineage_budget_strength:
      type: float
      min: 0.4
      max: 1.0
  rule_variants:
    budget_mode:
      type: choice
      values:
        - dynamic
        - uniform
      weights:
        - 0.9
        - 0.1
  initial_conditions:
    initialization_strategy:
      type: choice
      values:
        - stratified
        - opposition
        - random_uniform
      weights:
        - 0.5
        - 0.3
        - 0.2
