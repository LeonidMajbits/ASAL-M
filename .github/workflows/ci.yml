name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify public commit identity
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          import subprocess

          rows = subprocess.check_output(
              ["git", "log", "--format=%H%x09%ae%x09%ce"],
              text=True,
          ).splitlines()
          for row in rows:
              commit, author, committer = row.split("\t")
              for role, email in (("author", author), ("committer", committer)):
                  if not email.lower().endswith("@users.noreply.github.com"):
                      raise SystemExit(
                          f"{commit}: {role} email is not a GitHub noreply address"
                      )
          PY
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check asal_m tests examples tools
          ruff format --check asal_m tests examples tools
      - name: Run tests
        run: |
          coverage run --source=asal_m -m pytest -q
          coverage report --fail-under=65
      - name: Verify checked-in public evidence
        run: |
          python tools/verify_public_evidence.py
          python -O tools/verify_public_evidence.py
      - name: Verify public documentation
        run: python tools/verify_public_docs.py

  reproducibility:
    name: Reproduce / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install certified reproduction environment
        run: |
          python -m pip install -U pip
          python -m pip install -c requirements-repro.txt -e .
      - name: Regenerate public evidence
        run: |
          python examples/certification_benchmark/regenerate.py
          python examples/public_demo/regenerate.py
      - name: Require byte-identical evidence
        run: |
          git diff --exit-code -- examples/certification_benchmark/benchmark.json
          git diff --exit-code -- examples/certification_benchmark/certification-comparison.png
          git diff --exit-code -- examples/public_demo/benchmark.json
          git diff --exit-code -- examples/public_demo/mutation_cells_seed42.gif
          python tools/verify_public_evidence.py
          python -O tools/verify_public_evidence.py

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [test, reproducibility]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Inspect wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from tarfile import open as open_tar
          from zipfile import ZipFile

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()
          require(
              any(name.startswith("asal_m/experiments/") and name.endswith(".yaml") for name in names),
              "wheel is missing packaged experiments",
          )
          require(
              any(name.endswith(".dist-info/licenses/NOTICE") for name in names),
              "wheel is missing NOTICE",
          )
          require(
              any(name.endswith(".dist-info/licenses/LICENSE") for name in names),
              "wheel is missing LICENSE",
          )
          require(
              not any("vendor/" in name or "runs/" in name for name in names),
              "wheel contains a forbidden private/output path",
          )

          sdist = next(Path("dist").glob("*.tar.gz"))
          with open_tar(sdist) as archive:
              source_names = archive.getnames()
          required = (
              "docs/USER_GUIDE.md",
              "docs/REPRODUCIBILITY.md",
              "docs/EXPERIMENTS.md",
              "CONTRIBUTING.md",
              "SECURITY.md",
              "requirements-repro.txt",
              "examples/certification_benchmark/benchmark.json",
              "examples/certification_benchmark/fonts/DejaVuSans.ttf",
              "examples/certification_benchmark/fonts/DejaVuSans-Bold.ttf",
              "examples/certification_benchmark/fonts/LICENSE-DEJAVU.txt",
              "tools/verify_public_docs.py",
          )
          require(
              all(any(name.endswith(item) for name in source_names) for item in required),
              "sdist is missing a required public release file",
          )
          forbidden = ("/vendor/", "/runs/", "/docs/assets/", "/examples/public_demo/findings/")
          require(
              not any(any(part in name for part in forbidden) for name in source_names),
              "sdist contains a forbidden private/output path",
          )
          PY
      - name: Install wheel smoke outside source tree
        run: |
          WHEEL_PATH="$(python -c "from pathlib import Path; print(next(Path('dist').glob('*.whl')).resolve())")"
          pip install --force-reinstall "$WHEEL_PATH"
          SMOKE_DIR="$(mktemp -d)"
          cd "$SMOKE_DIR"
          python - <<'PY'
          from asal_m.__main__ import _load_experiment

          if _load_experiment("alpha_mainline")["substrate"] != "alpha_alife":
              raise SystemExit("installed wheel cannot load the bundled alpha experiment")
          PY
          python -m asal_m --help
