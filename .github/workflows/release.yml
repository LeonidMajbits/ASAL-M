name: release-artifacts

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Require tag and package version to match
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(
                  f"release tag {actual!r} does not match package {expected!r}"
              )
          PY
      - name: Build and inspect distributions
        run: |
          python -m pip install -U pip build twine check-wheel-contents
          python -m build
          python -m twine check dist/*
          check-wheel-contents dist/*.whl
          python tools/verify_public_repository.py --archives dist
      - name: Build deterministic SPDX SBOM
        run: |
          RELEASE_VENV="$RUNNER_TEMP/asal-m-release-venv"
          python -m venv "$RELEASE_VENV"
          "$RELEASE_VENV/bin/python" -m pip install -U pip
          "$RELEASE_VENV/bin/python" -m pip install \
            -c requirements-repro.txt \
            dist/*.whl
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          "$RELEASE_VENV/bin/python" tools/build_sbom.py \
            --subject dist/*.whl \
            --output "dist/asal_m-${GITHUB_REF_NAME#v}.spdx.json" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
          "$RELEASE_VENV/bin/python" tools/build_sbom.py \
            --subject dist/*.whl \
            --output "dist/asal_m-${GITHUB_REF_NAME#v}.spdx.json" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --verify
          cp docs/keys/asal-m-release-signing.pub dist/
          cp docs/keys/allowed_signers dist/
          python tools/build_release_assets.py
          python tools/build_release_assets.py --verify
          python tools/verify_public_repository.py \
            --archives dist \
            --release-files dist
      - name: Attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attest wheel SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/*.whl
          sbom-path: dist/*.spdx.json
      - name: Upload attested release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.spdx.json
            dist/*.pub
            dist/allowed_signers
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
